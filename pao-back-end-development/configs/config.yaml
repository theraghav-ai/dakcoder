appname: "Pao-App" # change appname accordingly. This is necessary for tracing. else will not work.
trace:
  enabled: true #trace enable/disable
  processor: 
    type: "otlp-grpc"
    options:
      host: "localhost:4317"
  sampler:
    type: always-on
    # type: parent-based-trace-id-ratio
    options: 
      ratio: 0.1
