<!DOCTYPE html>
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8" />
    <!--
      default-src 'none' and a per-load nonce. Nothing here fetches: no CDN, no
      font host, no image host beyond the extension's own resource origin. A
      webview that cannot reach the network cannot leak a transcript to one.

      font-src is what lets media/fonts/*.woff2 load. It is the extension's own
      origin and nothing else, which is why the design's two faces are vendored
      rather than linked from Google.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src {{csp}}; font-src {{csp}}; img-src {{csp}} data:; script-src 'nonce-{{nonce}}';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="{{style}}" />
    <title>dakcoder</title>
  </head>
  <body>
    <!--
      The skip link is the first focusable thing in the panel and is revealed
      only while an approval is pending, so there is always a keyboard route to
      the card without a permanent target that goes nowhere.
    -->
    <button id="skip" class="skip" type="button" hidden></button>

    <!--
      The header band: the console row, then the context meter directly beneath
      it with no rule between them. They are one block because the status and
      the number it is spending are one fact, and two hairlines at a 340px
      sidebar width is a border for every eleven rows of content.

      The console row is hidden while idle, so an idle panel pays for nothing
      but the meter's own line.

      Only fixed-height, non-list state earns persistent chrome here — that rule
      is what keeps this to two rows at a sidebar width of 340px. Everything
      list-shaped (the plan, sessions, quota, the context breakdown) is a
      sibling view the workbench already lets the user resize.
    -->
    <header id="console" class="console" hidden></header>

    <header id="meter" class="meter"></header>

    <!--
      role="log" and deliberately NO aria-live.

      An aria-live ancestor announces every descendant insertion. On a forty-turn
      run that is every code block, every tool row and all thirty cells of the
      gate grid read aloud in order, which is unusable. One composed sentence per
      event goes to #announce instead, which is a sibling and therefore not an
      ancestor of anything the renderer appends here.
    -->
    <main id="transcript" class="transcript" role="log" tabindex="-1"></main>

    <div id="announce" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

    <footer id="composer" class="composer">
      <!--
        Offline is a card rather than a line, because the distinction that
        matters — "the panel lost the stream" versus "the run died" — takes two
        sentences and the second one is the reassuring half.
      -->
      <div id="offline" class="offline" hidden></div>

      <div id="queued" class="queued" hidden></div>

      <!-- Anchored to .composer, not to .field, so it clears the border. -->
      <ul id="popup" class="popup" role="listbox" hidden></ul>

      <!--
        The field and its actions are one bordered block, so the send button
        reads as part of the thing being typed rather than as a toolbar under
        it. The border is what carries composer state.
      -->
      <div class="field">
        <!--
          A textarea as combobox: ARIA 1.2 allows it, and it keeps multi-line
          input working while the slash/mention popup is open.
        -->
        <label class="sr-only" for="input" id="input-label"></label>
        <textarea
          id="input"
          class="input"
          rows="1"
          role="combobox"
          aria-expanded="false"
          aria-controls="popup"
          aria-autocomplete="list"
          aria-labelledby="input-label"
        ></textarea>

        <div class="actions">
          <span id="mode-pill" class="mode-pill" hidden></span>
          <div id="working" class="working" hidden></div>
          <span id="keys" class="hint-keys" hidden></span>
          <span class="spacer"></span>
          <button id="wind-down" class="secondary" type="button" hidden></button>
          <button id="stop" class="danger" type="button" hidden></button>
          <button id="send" class="primary" type="button"></button>
        </div>
      </div>
    </footer>

    <script nonce="{{nonce}}" src="{{script}}"></script>
  </body>
</html>
