# Both packages are exercised from the repository root, without installing
# them: a first run that needs `pip install` is a first run that can fail on
# the corporate network (Part B §4.2), and that applies to contributors as
# much as to the shipped runtime.
[pytest]
testpaths = apps
pythonpath =
    apps/shared/src
    apps/agent/src
    apps/gateway/src
addopts = -q --strict-markers
# The gateway is async because it is a server; the agent is sync because a
# loop is sequential. auto mode means neither has to decorate every test.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    slow: exercises a full simulated run rather than one unit
