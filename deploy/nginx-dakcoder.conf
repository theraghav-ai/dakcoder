# dakcoder gateway — https://ai.cept.gov.in/dakcoder/
#
# Installed by deploy/install-nginx.sh as /etc/nginx/snippets/dakcoder.conf and
# pulled into the 443 server block in sites-available/api.conf with a single
# `include`. Editing this file and re-running the installer is the whole update
# story; api.conf itself is touched once, ever.
#
# The upstream is the gateway on 127.0.0.1:8790 — identity, quota, the usage
# ledger and the model proxy. It is the only process holding the LiteLLM key,
# which is what makes the access rules below load-bearing rather than tidy.
#
#   /dakcoder/v1/health          capabilities and the limits in force
#   /dakcoder/v1/tools           the tool schemas (contract C1)
#   /dakcoder/v1/quota           the window snapshot (C4)
#   /dakcoder/v1/runs            open a run
#   /dakcoder/v1/llm/…           the model proxy — SSE, long-lived
#   /dakcoder/v1/auth/…          sign-in (C3) — SEE THE BLOCK BELOW

# Bare path to the trailing-slash form, so a copied link works.
location = /dakcoder {
    return 301 /dakcoder/;
}

# ---------------------------------------------------------------------------
# Sign-in is NOT published while the dev identity provider is in use.
#
# With no GitLab OAuth application configured, the gateway runs a local stand-in
# that accepts *any* authorization code and returns a fixed developer. On
# loopback that is a convenience. Published, it is an open door: anyone reaching
# this URL could mint a valid session and spend the shared GPU budget with our
# key attached, which is the exact failure the gateway exists to prevent.
#
# Everything else stays reachable because it already requires a dakcoder JWT,
# signed with a secret that only the gateway holds. Tokens are minted on the
# host until a real IdP exists:
#
#     deploy/gateway_main.py --mint dev:<user> --mint-hours 12
#
# TO PUBLISH SIGN-IN: configure DAKCODER_GITLAB_URL, _CLIENT_ID and
# _CLIENT_SECRET in deploy/dakcoder.env, restart the gateway, confirm
# /dakcoder/v1/health reports `"identity": "gitlab"`, then delete this block and
# re-run the installer. Do not delete it while health still says "dev".
# ---------------------------------------------------------------------------
location ~ ^/dakcoder/v1/auth/ {
    default_type application/json;
    return 403 '{"error":"forbidden","reason":"sign-in is not published on this host; the gateway is using a local development identity provider. See deploy/nginx-dakcoder.conf."}';
}

location /dakcoder/ {
    proxy_pass http://127.0.0.1:8790/;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The model proxy streams SSE. Buffering here would hold every chunk until
    # the stream ended, turning a streaming endpoint into a slow non-streaming
    # one with no error to explain it. The gateway also sends
    # X-Accel-Buffering: no; this is the same instruction stated locally so it
    # does not depend on a header surviving a future change.
    proxy_buffering         off;
    proxy_request_buffering off;
    proxy_cache             off;
    gzip                    off;

    # A coder turn can generate for minutes. The client's own read timeout is
    # 600s (LLMConfig.read_timeout), so anything shorter here means nginx cuts
    # the connection first and the developer sees a truncated stream rather
    # than a timeout they can act on.
    proxy_connect_timeout 10s;
    proxy_send_timeout    660s;
    proxy_read_timeout    660s;
}
