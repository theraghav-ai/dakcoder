[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dakcoder-agent"
version = "0.3.2"
description = "The dakcoder agent loop, tool router and context manager"
requires-python = ">=3.11"
dependencies = ["dakcoder-shared", "fastapi>=0.110", "uvicorn>=0.30"]

[project.scripts]
# What the extension spawns. A console script rather than `python -m`, so the
# venv's bin directory is the whole discovery story on every platform.
dakcoderd = "dakcoder_agent.serve:main"

[project.optional-dependencies]
# swagger_check parses configs/*.yaml. Without PyYAML the check reports
# "inconclusive" rather than a false negative, so it stays optional — but a
# runtime that installs it gets a real answer.
yaml = ["pyyaml>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The prompts and playbooks are data the agent reads at runtime, not modules.
# Without this they are absent from the wheel and every run fails on the first
# turn — in the .vsix, where nobody has a source checkout to fall back to.
dakcoder_agent = [
    "prompts/*.md",
    "prompts/modes/*.md",
    "playbooks/*.json",
    # The knowledge base search_docs serves. Generated by `make -C gotools
    # knowledge` alongside packages/knowledge and held in lockstep with it
    # by knowledge-check; without this the deployed runtime answers every
    # search_docs call with "the knowledge base is not installed".
    "knowledge/*.md",
    "knowledge/references/*.md",
]
