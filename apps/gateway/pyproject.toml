[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dakcoder-gateway"
version = "0.1.0"
description = "Auth, quota, ledger and the model proxy. Server only — never in the .vsix."
requires-python = ">=3.11"
dependencies = ["dakcoder-shared", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]
